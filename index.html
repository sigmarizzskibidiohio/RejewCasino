<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RejewCas Ultimate Extended</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #09090b; --surface: #141417; --surface-accent: #1f1f24;
            --gold: #ffd700; --green: #00e676; --red: #ff5252; --purple: #a855f7;
            --text: #ffffff; --text-secondary: #71717a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #maintenance-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 99999; flex-direction: column;
            align-items: center; justify-content: center; padding: 30px; text-align: center;
        }
        #toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 280px; pointer-events: none; }
        .toast {
            background: #18181b; color: #fff; padding: 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transform: translateX(50px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-left: 4px solid #fff; pointer-events: auto;
        }
        .toast.show { opacity: 1; transform: translateX(0) scale(1); }
        .toast.success { border-left-color: var(--green); }
        .toast.error { border-left-color: var(--red); }
        .toast.gold { border-left-color: var(--gold); }
        .toast.purple { border-left-color: var(--purple); }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: linear-gradient(to bottom, #141417, transparent); position: fixed; top: 0; width: 100%; z-index: 10;
            border-bottom: 1px solid rgba(255, 215, 0, 0.03);
        }
        .brand { font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; color: #fff; }
        .brand span { color: var(--gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
        .header-capsules { display: flex; gap: 8px; }
        .capsule {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
            padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: transform 0.2s ease;
        }
        .capsule:active { transform: scale(0.95); }
        .capsule.wallet { border-color: rgba(0, 230, 118, 0.15); color: var(--green); }
        .main-container { flex: 1; margin-top: 75px; margin-bottom: 75px; position: relative; width: 100%; z-index: 2; overflow-x: hidden; overflow-y: auto; }
        .screen {
            display: none; padding: 20px; flex-direction: column; align-items: center; width: 100%; min-height: 100%; opacity: 0; transform: translateY(15px);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .screen.active { display: flex; opacity: 1; transform: translateY(0); }
        .game-card, .profile-card, .panel-card { background: var(--surface); border: 1px solid rgba(255, 215, 0, 0.08); border-radius: 24px; padding: 22px; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); margin-bottom: 15px; }
        .reels { display: flex; gap: 12px; margin: 25px 0; background: #0c0c0e; padding: 15px 25px; border-radius: 16px; width: 100%; justify-content: center; }
        .reel { font-size: 3.2rem; width: 65px; text-align: center; height: 75px; line-height: 75px; transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.35), filter 0.1s ease; }
        .reel.spinning { filter: blur(5px); transform: scale(1.08) translateY(-5px); }
        
        .crash-arena { width: 100%; height: 200px; background: #0c0c0e; border-radius: 16px; position: relative; overflow: hidden; margin: 15px 0; border: 1px solid rgba(255,255,255,0.04); }
        .rocket { position: absolute; bottom: 15px; left: 15px; font-size: 2.5rem; z-index: 5; will-change: transform; transform-origin: center center; }
        .crash-multiplier { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; color: #fff; z-index: 4; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .crash-svg-path { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        .plinko-arena-wrapper { width: 100%; background: #0c0c0e; border-radius: 16px; padding: 10px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #plinko-canvas { max-width: 100%; height: auto; display: block; background: transparent; }

        .upgrader-arena { width: 100%; height: 220px; background: #0c0c0e; border-radius: 16px; position: relative; margin: 15px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.04); }
        .upgrader-circle-outer { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--purple) 0deg, #1f1f24 0deg); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 25px rgba(168,85,247,0.25); }
        .upgrader-circle-inner { width: 110px; height: 110px; border-radius: 50%; background: #0c0c0e; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; z-index: 2; }
        
        .upgrader-needle-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; z-index: 3; pointer-events: none; }
        .upgrader-needle { position: absolute; top: -6px; left: calc(50% - 4px); width: 8px; height: 24px; background: var(--gold); border-radius: 4px; box-shadow: 0 0 12px var(--gold); }
        .upgrader-needle::after { content: ''; position: absolute; bottom: -6px; left: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--gold); }

        .clicker-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 320px; }
        .click-coin {
            width: 180px; height: 180px; background: linear-gradient(135deg, var(--gold), #d4af37); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5.5rem; cursor: pointer; user-select: none;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.35), inset 0 0 20px rgba(255,255,255,0.4); transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s ease; will-change: transform; border: 6px solid #1c1917;
        }
        .click-coin:active { transform: scale(0.88); box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(255,255,255,0.2); }
        .bet-input-wrapper { width: 100%; margin-bottom: 15px; }
        .bet-label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .bet-field-group { display: flex; background: #0c0c0e; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
        .bet-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 700; padding: 12px; outline: none; }
        .max-btn { background: var(--surface-accent); border: none; color: var(--gold); font-size: 0.8rem; font-weight: 700; padding: 0 15px; cursor: pointer; transition: background 0.2s; }
        .max-btn:active { background: #2a2a30; }
        .action-btn { background: linear-gradient(135deg, var(--gold), #d4af37); border: none; color: #000; font-weight: 800; font-size: 1rem; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; }
        .action-btn:active { transform: scale(0.96); opacity: 0.9; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
        .avatar-stub { width: 65px; height: 65px; background: var(--surface-accent); border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .user-id-badge { background: #0c0c0e; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-secondary); cursor: pointer; border: 1px solid rgba(255,255,255,0.04); display: inline-flex; align-items: center; gap: 4px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-box { background: #0c0c0e; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .stat-val.win { color: var(--green); }
        .stat-val.loss { color: var(--red); }
        .stat-lbl { font-size: 0.65rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; }
        .shop-section { width: 100%; max-width: 360px; margin-top: 0; }
        .shop-title { font-size: 0.8rem; font-weight: 800; color: var(--gold); text-transform: uppercase; margin: 25px 0 12px 0; letter-spacing: 1px; border-left: 3px solid var(--gold); padding-left: 8px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 14px 16px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.04); }
        .shop-item-info { display: flex; flex-direction: column; text-align: left; max-width: 65%; }
        .shop-item-name { font-size: 0.88rem; font-weight: 700; color: #fff; }
        .shop-item-cost { font-size: 0.78rem; color: var(--text-secondary); font-weight: 600; margin-top: 4px; }
        .buy-btn { background: var(--surface-accent); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .buy-btn:active { transform: scale(0.92); }
        .buy-btn.owned { background: transparent; border-color: var(--green); color: var(--green); cursor: default; transform: none; }
        .buy-btn.locked { background: #221515; border-color: var(--red); color: var(--red); cursor: not-allowed; transform: none; }
        .msg-box { background: #0c0c0e; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 10px; text-align: left; font-size: 0.82rem; }
        .user-link { color: var(--gold); font-weight: 700; cursor: pointer; text-decoration: underline; }
        nav { position: fixed; bottom: 0; width: 100%; height: 68px; background: #141417; border-top: 1px solid rgba(255,255,255,0.04); display: flex; justify-around: align-items: center; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); background: none; border: none; cursor: pointer; font-size: 0.65rem; gap: 5px; font-weight: 600; flex: 1; transition: color 0.2s ease, transform 0.1s ease; }
        .nav-item:active { transform: scale(0.93); }
        .nav-item.active { color: var(--gold); }
        .nav-item svg { fill: currentColor; width: 18px; height: 18px; }
    </style>
</head>
<body>

    <div id="maintenance-screen">
        <h1 style="font-size: 4rem; margin: 0;">🛠️</h1>
        <h2 style="color: var(--gold); text-transform: uppercase; font-weight: 900; letter-spacing: 1px;">Технические работы</h2>
        <p style="color: var(--text-secondary); max-width: 280px; font-size: 0.9rem;">Казино временно закрыто на обслуживание. Зайди чуть позже!</p>
    </div>

    <div id="toast-container"></div>

    <header>
        <div class="brand">Rejew<span>Cas</span></div>
        <div class="header-capsules">
            <div class="capsule wallet" onclick="switchScreen('profile')">
                <span id="header-bal">0</span> <span style="font-size:0.75rem;font-weight:800;color:var(--gold)">$RJC</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- СЛОТЫ -->
        <div id="screen-spins" class="screen active">
            <div class="game-card">
                <div style="color:var(--text-secondary); font-size:0.75rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;">Classic Slots</div>
                <div class="reels">
                    <div class="reel" id="r1">💎</div>
                    <div class="reel" id="r2">💎</div>
                    <div class="reel" id="r3">💎</div>
                </div>
                <div class="bet-input-wrapper">
                    <label class="bet-label">Ваша Ставка ($RJC)</label>
                    <div class="bet-field-group">
                        <input type="number" class="bet-input" id="slot-bet" value="100" min="10">
                        <button class="max-btn" onclick="setMaxBet('slot-bet')">MAX</button>
                    </div>
                </div>
                <button class="action-btn" id="spin-btn" onclick="triggerSpin()">SPIN</button>
            </div>
        </div>
    <!-- БЛОК 2: ДАННЫЕ МАРКЕТА И ГЛОБАЛЬНОЕ СОСТОЯНИЕ -->
    <script>
        const PERMITS_DATA = [
            { id: 'p_slots', name: 'Лицензия на Слоты', cost: 500, desc: 'Допуск к игре в Classic Slots', icon: '🎰' },
            { id: 'p_crash', name: 'Пермит Пилота (Crash)', cost: 1500, desc: 'Разрешение на запуск Ракетки', icon: '🚀' },
            { id: 'p_plinko', name: 'Лицензия Плинко', cost: 3000, desc: 'Допуск к арене Plinko', icon: '⚪' },
            { id: 'p_upgrader', name: 'Сертификат Апгрейдера', cost: 5000, desc: 'Допуск к контрактам улучшения', icon: '⚡' }
        ];

        const CITIZENSHIP_DATA = [
            { id: 'c_base', name: 'Резидент СНГ', cost: 1000, boost: 2, desc: '+2 $RJC за каждый тап', icon: '📜' },
            { id: 'c_eu', name: 'ВНЖ Евросоюза', cost: 10000, boost: 5, desc: '+5 $RJC за каждый тап', icon: '🇪🇺' },
            { id: 'c_dubai', name: 'Золотая Виза Дубай', cost: 50000, boost: 15, desc: '+15 $RJC за каждый тап', icon: '🇦🇪' },
            { id: 'c_island', name: 'Паспорт Офшора', cost: 250000, boost: 50, desc: '+50 $RJC за каждый тап', icon: '🏝️' }
        ];

        const CARS_DATA = [
            { id: 'car_1', name: 'Lada Sedan', cost: 2000, desc: 'Боевая классика', icon: '🚗' },
            { id: 'car_2', name: 'BMW M5 F90', cost: 25000, desc: 'Быстрый седан для города', icon: '🏎️' },
            { id: 'car_3', name: 'Porsche 911 GT3 RS', cost: 100000, desc: 'Идеален для трека', icon: '🏎️' },
            { id: 'car_4', name: 'Bugatti Chiron', cost: 1000000, desc: 'Гиперкар мечты', icon: '🏎️' }
        ];

        const HOUSES_DATA = [
            { id: 'h_1', name: 'Студия в Бутово', cost: 15000, income: 50, desc: 'Пассивный доход: 50 $RJC/мин', icon: '🏢' },
            { id: 'h_2', name: 'Апартаменты в Сити', cost: 120000, income: 450, desc: 'Пассивный доход: 450 $RJC/мин', icon: '🏙️' },
            { id: 'h_3', name: 'Вилла на Бали', cost: 800000, income: 3200, desc: 'Пассивный доход: 3200 $RJC/мин', icon: '🏡' },
            { id: 'h_4', name: 'Пентхаус в Монако', cost: 5000000, income: 25000, desc: 'Пассивный доход: 25000 $RJC/мин', icon: '🏰' }
        ];

        const YACHTS_DATA = [
            { id: 'y_1', name: 'Катер Sea Ray', cost: 80000, desc: 'Для прогулок по рекам', icon: '🛥️' },
            { id: 'y_2', name: 'Яхта Princess 68', cost: 500000, desc: 'Премиальный круизер', icon: '🛥️' },
            { id: 'y_3', name: 'Суперяхта Eclipse', cost: 10000000, desc: 'Король морей и океанов', icon: '🛳️' }
        ];

        // Глобальное состояние
        let state = {
            user: {
                id: '777000',
                username: 'player',
                nickname: 'Игрок',
                role: 'user', // 'user', 'moderator', 'admin'
                balance: 1000,
                clickBoost: 1,
                totalGames: 0,
                wins: 0,
                losses: 0,
                refCount: 0,
                refTurnover: 0,
                citizenship: 'Без гражданства',
                inventory: {
                    permits: [],
                    citizenships: [],
                    cars: [],
                    houses: [],
                    yachts: []
                }
            },
            adminRig: {
                mode: 'normal', // 'normal', 'win_always', 'lose_always', 'boost_50'
                targetUser: null
            },
            maintenance: false,
            stats: {
                totalUsers: 1,
                totalBalance: 1000,
                totalTurnover: 0,
                moderatorsCount: 0,
                startTime: Date.now()
            },
            promocodes: {},
            transactions: [],
            otherUsers: {} // Реестр пользователей для чекера и переводов
        };

        const tg = window.Telegram?.WebApp;

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            if (tg) {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe?.user) {
                    const u = tg.initDataUnsafe.user;
                    state.user.id = String(u.id);
                    state.user.username = u.username || `user_${u.id}`;
                    state.user.nickname = u.first_name || 'Игрок';
                }
            }
            
            // Вносим юзера в локальную база-эмуляцию
            registerUserInDb(state.user);

            loadSavedState();
            renderShop();
            updateUI();
            initPlinkoCanvas();
            startPassiveIncomeTimer();
        });

        function registerUserInDb(u) {
            state.otherUsers[u.id] = {
                id: u.id,
                username: u.username,
                nickname: u.nickname,
                role: u.role,
                balance: u.balance,
                totalGames: u.totalGames,
                wins: u.wins,
                losses: u.losses
            };
        }

        function saveState() {
            try {
                localStorage.setItem('rejew_cas_state_v2', JSON.stringify({
                    user: state.user,
                    promocodes: state.promocodes,
                    transactions: state.transactions,
                    adminRig: state.adminRig,
                    maintenance: state.maintenance
                }));
            } catch (e) {
                console.error('Ошибка сохранения:', e);
            }
        }

        function loadSavedState() {
            try {
                const raw = localStorage.getItem('rejew_cas_state_v2');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.user) state.user = { ...state.user, ...parsed.user };
                    if (parsed.promocodes) state.promocodes = parsed.promocodes;
                    if (parsed.transactions) state.transactions = parsed.transactions;
                    if (parsed.adminRig) state.adminRig = parsed.adminRig;
                    if (parsed.maintenance !== undefined) state.maintenance = parsed.maintenance;
                }
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }

        function showToast(msg, type = 'gold') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setMaxBet(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = Math.max(10, Math.floor(state.user.balance));
            }
        }

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            const targetScreen = document.getElementById(`screen-${screenName}`);
            const targetTab = document.getElementById(`tab-${screenName}`);

            if (targetScreen) targetScreen.classList.add('active');
            if (targetTab) targetTab.classList.add('active');
        }

        function updateUI() {
            // Баланс и профиль
            document.getElementById('header-bal').innerText = Math.floor(state.user.balance).toLocaleString();
            document.getElementById('prof-name').innerText = state.user.nickname;
            document.getElementById('prof-id').innerText = state.user.id;
            document.getElementById('prof-citizen').innerText = state.user.citizenship;
            
            // Статус / Роль
            const statusEl = document.getElementById('prof-status');
            if (state.user.role === 'admin') {
                statusEl.innerText = '👑 Администратор';
                statusEl.style.color = 'var(--gold)';
            } else if (state.user.role === 'moderator') {
                statusEl.innerText = '🛡️ Модератор';
                statusEl.style.color = '#3b82f6';
            } else {
                statusEl.innerText = '👤 Игрок';
                statusEl.style.color = '#fff';
            }

            // Статистика
            document.getElementById('stat-total').innerText = state.user.totalGames;
            document.getElementById('stat-wins').innerText = state.user.wins;
            document.getElementById('stat-losses').innerText = state.user.losses;

            // Кликер профит label
            document.getElementById('clicker-profit-label').innerText = `+${state.user.clickBoost} $RJC за каждый тап`;

            // Админка
            const adminPanel = document.getElementById('admin-panel');
            if (state.user.role === 'admin' || state.user.role === 'moderator') {
                adminPanel.style.display = 'block';
                document.getElementById('admin-panel-title').innerText = state.user.role === 'admin' ? '👑 Админ Панель' : '🛡️ Модер Панель';
            } else {
                adminPanel.style.display = 'none';
            }

            // Техработ экраны
            const maintScreen = document.getElementById('maintenance-screen');
            if (state.maintenance && state.user.role !== 'admin') {
                maintScreen.style.display = 'flex';
            } else {
                maintScreen.style.display = 'none';
            }

            updateTechStats();
            renderTransactions();
        }

        function updateTechStats() {
            document.getElementById('tech-users').innerText = Object.keys(state.otherUsers).length;
            document.getElementById('tech-bal').innerText = Math.floor(state.user.balance).toLocaleString();
            document.getElementById('tech-turnover').innerText = Math.floor(state.stats.totalTurnover).toLocaleString();
            document.getElementById('tech-mods').innerText = state.stats.moderatorsCount;
            
            const uptimeSec = Math.floor((Date.now() - state.stats.startTime) / 1000);
            document.getElementById('tech-uptime').innerText = uptimeSec;
        }
    <!-- БЛОК 3: ЛОГИКА МАРКЕТА, СЛОТОВ, КРАША И ПЛИНКО -->
    <script>
        // Продолжение скрипта

        function renderShop() {
            renderShopCategory('permits-shop', PERMITS_DATA, 'permits');
            renderShopCategory('citizenship-shop', CITIZENSHIP_DATA, 'citizenships');
            renderShopCategory('cars-shop', CARS_DATA, 'cars');
            renderShopCategory('houses-shop', HOUSES_DATA, 'houses');
            renderShopCategory('yachts-shop', YACHTS_DATA, 'yachts');
        }

        function renderShopCategory(containerId, dataList, categoryKey) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            dataList.forEach(item => {
                const isOwned = state.user.inventory[categoryKey]?.includes(item.id);
                const el = document.createElement('div');
                el.className = 'shop-item';
                
                let btnHtml = '';
                if (isOwned) {
                    btnHtml = `<button class="buy-btn owned">Куплено ✓</button>`;
                } else {
                    btnHtml = `<button class="buy-btn" onclick="buyShopItem('${categoryKey}', '${item.id}', ${item.cost})">Купить</button>`;
                }

                el.innerHTML = `
                    <div style="font-size:1.8rem; margin-right:12px;">${item.icon}</div>
                    <div class="shop-item-info" style="flex:1;">
                        <div class="shop-item-name">${item.name}</div>
                        <div style="font-size:0.7rem; color:var(--text-secondary); margin-top:2px;">${item.desc}</div>
                        <div class="shop-item-cost">${item.cost.toLocaleString()} $RJC</div>
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(el);
            });
        }

        function buyShopItem(category, itemId, cost) {
            if (state.user.balance < cost) {
                showToast('Недостаточно $RJC на балансе!', 'error');
                return;
            }

            state.user.balance -= cost;
            if (!state.user.inventory[category]) state.user.inventory[category] = [];
            state.user.inventory[category].push(itemId);

            // Бусты гражданства
            if (category === 'citizenships') {
                const item = CITIZENSHIP_DATA.find(c => c.id === itemId);
                if (item) {
                    state.user.clickBoost += item.boost;
                    state.user.citizenship = item.name;
                }
            }

            saveState();
            renderShop();
            updateUI();
            showToast('Успешная покупка!', 'success');
        }

        // --- ПРОВЕРКА ПОДКТУТКИ ---
        function checkRigResult() {
            if (state.adminRig.mode === 'win_always') return true;
            if (state.adminRig.mode === 'lose_always') return false;
            if (state.adminRig.mode === 'boost_50') return Math.random() < 0.75;
            return Math.random() < 0.45; // Базовый винрейт ~45%
        }

        // --- ИГРА 1: СЛОТЫ ---
        let isSpinning = false;
        function triggerSpin() {
            if (isSpinning) return;
            if (state.maintenance && state.user.role !== 'admin') {
                showToast('Казино на техобслуживании!', 'error');
                return;
            }
            if (!state.user.inventory.permits.includes('p_slots')) {
                showToast('Нужна Лицензия на Слоты из Маркета!', 'error');
                return;
            }

            const betInput = document.getElementById('slot-bet');
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet < 10) {
                showToast('Минимальная ставка: 10 $RJC', 'error');
                return;
            }
            if (state.user.balance < bet) {
                showToast('Недостаточно баланса!', 'error');
                return;
            }

            state.user.balance -= bet;
            state.user.totalGames++;
            state.stats.totalTurnover += bet;
            isSpinning = true;
            updateUI();

            const symbols = ['💎', '7️⃣', '🍋', '🔔', '🍒', '🍇', '👑'];
            const r1 = document.getElementById('r1');
            const r2 = document.getElementById('r2');
            const r3 = document.getElementById('r3');

            r1.classList.add('spinning');
            r2.classList.add('spinning');
            r3.classList.add('spinning');

            const isWin = checkRigResult();

            setTimeout(() => {
                let sym1, sym2, sym3;
                if (isWin) {
                    const winSym = symbols[Math.floor(Math.random() * symbols.length)];
                    sym1 = winSym; sym2 = winSym; sym3 = winSym;
                } else {
                    sym1 = symbols[Math.floor(Math.random() * symbols.length)];
                    sym2 = symbols[Math.floor(Math.random() * symbols.length)];
                    sym3 = symbols[Math.floor(Math.random() * symbols.length)];
                    if (sym1 === sym2 && sym2 === sym3) {
                        sym3 = symbols[(symbols.indexOf(sym3) + 1) % symbols.length];
                    }
                }

                r1.innerText = sym1;
                r1.classList.remove('spinning');
                
                setTimeout(() => {
                    r2.innerText = sym2;
                    r2.classList.remove('spinning');
                    
                    setTimeout(() => {
                        r3.innerText = sym3;
                        r3.classList.remove('spinning');

                        if (sym1 === sym2 && sym2 === sym3) {
                            let mult = 5;
                            if (sym1 === '💎') mult = 10;
                            if (sym1 === '👑') mult = 25;
                            const prize = bet * mult;
                            state.user.balance += prize;
                            state.user.wins++;
                            showToast(`ЗАНОС! +${prize.toLocaleString()} $RJC (x${mult})`, 'gold');
                        } else {
                            state.user.losses++;
                            showToast(`Не повезло! -${bet} $RJC`, 'error');
                        }
                        isSpinning = false;
                        saveState();
                        updateUI();
                    }, 250);
                }, 250);
            }, 600);
        }

        // --- ИГРА 2: РАКЕТКА (CRASH) ---
        let crashState = 'idle'; // 'idle', 'running', 'crashed'
        let crashTimer = null;
        let crashMult = 1.00;
        let crashBetAmount = 0;
        let crashTargetMult = 1.00;

        function triggerCrashAction() {
            const btn = document.getElementById('crash-btn');
            
            if (crashState === 'idle') {
                if (state.maintenance && state.user.role !== 'admin') {
                    showToast('Казино на техобслуживании!', 'error');
                    return;
                }
                if (!state.user.inventory.permits.includes('p_crash')) {
                    showToast('Нужен Пермит Пилота из Маркета!', 'error');
                    return;
                }

                const betInput = document.getElementById('crash-bet');
                const bet = parseFloat(betInput.value);
                if (isNaN(bet) || bet < 10) {
                    showToast('Мин. ставка: 10 $RJC', 'error');
                    return;
                }
                if (state.user.balance < bet) {
                    showToast('Недостаточно средств!', 'error');
                    return;
                }

                state.user.balance -= bet;
                crashBetAmount = bet;
                state.user.totalGames++;
                state.stats.totalTurnover += bet;

                // Точка взрыва
                const willWin = checkRigResult();
                crashTargetMult = willWin ? (1.5 + Math.random() * 8) : (1.01 + Math.random() * 0.4);

                crashState = 'running';
                crashMult = 1.00;
                btn.innerText = 'ЗАБРАТЬ';
                btn.style.background = 'linear-gradient(135deg, var(--gold), #d4af37)';
                btn.style.color = '#000';

                runCrashAnimation();
                updateUI();

            } else if (crashState === 'running') {
                // Забрать выигрыш
                crashState = 'idle';
                clearInterval(crashTimer);
                const winAmount = Math.floor(crashBetAmount * crashMult);
                state.user.balance += winAmount;
                state.user.wins++;

                showToast(`Успел забрать! +${winAmount.toLocaleString()} $RJC (x${crashMult.toFixed(2)})`, 'success');
                resetCrashUI();
                saveState();
                updateUI();
            }
        }

        function runCrashAnimation() {
            const multEl = document.getElementById('crash-mult');
            const rocket = document.getElementById('rocket-obj');
            const path = document.getElementById('flight-line');

            let progress = 0;
            crashTimer = setInterval(() => {
                crashMult += 0.03 + (crashMult * 0.015);
                multEl.innerText = crashMult.toFixed(2) + 'x';

                progress = Math.min(1, progress + 0.015);
                const x = 15 + progress * 240;
                const y = 185 - (Math.pow(progress, 2) * 140);

                rocket.style.transform = `translate(${x}px, -${185 - y}px)`;
                path.setAttribute('d', `M 15 185 Q ${x/2} 185 ${x} ${y}`);

                if (crashMult >= crashTargetMult) {
                    // Взрыв!
                    clearInterval(crashTimer);
                    crashState = 'idle';
                    state.user.losses++;
                    multEl.innerText = 'CRASH!';
                    multEl.style.color = 'var(--red)';
                    showToast(`Ракетка взорвалась на x${crashMult.toFixed(2)}!`, 'error');

                    setTimeout(() => {
                        resetCrashUI();
                        saveState();
                        updateUI();
                    }, 1200);
                }
            }, 60);
        }

        function resetCrashUI() {
            const btn = document.getElementById('crash-btn');
            const multEl = document.getElementById('crash-mult');
            const rocket = document.getElementById('rocket-obj');
            const path = document.getElementById('flight-line');

            btn.innerText = 'ВЗЛЕТ';
            btn.style.background = 'linear-gradient(135deg, var(--green), #00c853)';
            btn.style.color = '#000';
            multEl.innerText = '1.00x';
            multEl.style.color = '#fff';
            rocket.style.transform = 'translate(0px, 0px)';
            path.setAttribute('d', 'M 15 185 Q 15 185 15 185');
        }

        // --- ИГРА 3: ПЛИНКО (CANVAS И ФИЗИКА) ---
        let plinkoCtx = null;
        let plinkoPegs = [];
        let plinkoBalls = [];
        let plinkoBins = [0.2, 0.5, 1.2, 3.0, 1.2, 0.5, 0.2];

        function initPlinkoCanvas() {
            const canvas = document.getElementById('plinko-canvas');
            if (!canvas) return;
            plinkoCtx = canvas.getContext('2d');

            // Создаем гвозди (pegs)
            plinkoPegs = [];
            const rows = 6;
            for (let r = 0; r < rows; r++) {
                const count = r + 3;
                const startX = (320 - (count - 1) * 35) / 2;
                const y = 40 + r * 40;
                for (let c = 0; c < count; c++) {
                    plinkoPegs.push({ x: startX + c * 35, y: y });
                }
            }

            requestAnimationFrame(updatePlinkoPhysics);
        }

        function triggerPlinko() {
            if (state.maintenance && state.user.role !== 'admin') {
                showToast('Казино на техобслуживании!', 'error');
                return;
            }
            if (!state.user.inventory.permits.includes('p_plinko')) {
                showToast('Нужна Лицензия Плинко из Маркета!', 'error');
                return;
            }

            const betInput = document.getElementById('plinko-bet');
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet < 10) {
                showToast('Мин. ставка: 10 $RJC', 'error');
                return;
            }
            if (state.user.balance < bet) {
                showToast('Недостаточно средств!', 'error');
                return;
            }

            state.user.balance -= bet;
            state.user.totalGames++;
            state.stats.totalTurnover += bet;
            updateUI();

            // Создаем шарик
            const isWin = checkRigResult();
            plinkoBalls.push({
                x: 160 + (Math.random() * 8 - 4),
                y: 10,
                vx: (Math.random() - 0.5) * 1.5,
                vy: 1,
                radius: 6,
                bet: bet,
                isRiggedWin: isWin
            });
        }

        function updatePlinkoPhysics() {
            if (!plinkoCtx) return;
            plinkoCtx.clearRect(0, 0, 320, 340);

            // Рисуем гвоздики
            plinkoCtx.fillStyle = '#71717a';
            plinkoPegs.forEach(peg => {
                plinkoCtx.beginPath();
                plinkoCtx.arc(peg.x, peg.y, 4, 0, Math.PI * 2);
                plinkoCtx.fill();
            });

            // Рисуем корзины снизу
            const binWidth = 320 / plinkoBins.length;
            plinkoBins.forEach((mult, idx) => {
                plinkoCtx.fillStyle = mult >= 1.0 ? 'rgba(0,230,118,0.2)' : 'rgba(255,82,82,0.2)';
                plinkoCtx.fillRect(idx * binWidth + 2, 300, binWidth - 4, 35);
                plinkoCtx.fillStyle = '#fff';
                plinkoCtx.font = 'bold 10px sans-serif';
                plinkoCtx.textAlign = 'center';
                plinkoCtx.fillText(`x${mult}`, idx * binWidth + binWidth / 2, 322);
            });

            // Двигаем и рискуем шарики
            for (let i = plinkoBalls.length - 1; i >= 0; i--) {
                const b = plinkoBalls[i];
                b.vy += 0.2; // гравитация
                b.x += b.vx;
                b.y += b.vy;

                // Столкновения с гвоздями
                plinkoPegs.forEach(peg => {
                    const dx = b.x - peg.x;
                    const dy = b.y - peg.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < b.radius + 4) {
                        b.vy *= -0.4;
                        const force = b.isRiggedWin ? (b.x < 160 ? 0.8 : -0.8) : (Math.random() > 0.5 ? 1.2 : -1.2);
                        b.vx = (dx / dist) * 2 + force * 0.5;
                        b.y = peg.y + (dy / dist) * (b.radius + 4);
                    }
                });

                // Границы
                if (b.x < b.radius) { b.x = b.radius; b.vx *= -0.5; }
                if (b.x > 320 - b.radius) { b.x = 320 - b.radius; b.vx *= -0.5; }

                // Рисуем шарик
                plinkoCtx.fillStyle = '#ffd700';
                plinkoCtx.beginPath();
                plinkoCtx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                plinkoCtx.fill();

                // Попадание в корзину
                if (b.y >= 300) {
                    const binIdx = Math.floor(b.x / binWidth);
                    const clampedIdx = Math.max(0, Math.min(plinkoBins.length - 1, binIdx));
                    const mult = plinkoBins[clampedIdx];
                    const winAmt = Math.floor(b.bet * mult);

                    state.user.balance += winAmt;
                    if (mult >= 1.0) {
                        state.user.wins++;
                        showToast(`Плинко: +${winAmt.toLocaleString()} $RJC (x${mult})`, 'success');
                    } else {
                        state.user.losses++;
                        showToast(`Плинко: x${mult} (-${b.bet - winAmt} $RJC)`, 'error');
                    }

                    plinkoBalls.splice(i, 1);
                    saveState();
                    updateUI();
                }
            }

            requestAnimationFrame(updatePlinkoPhysics);
        }
    <!-- БЛОК 4: АПГРЕЙДЕР, КЛИКЕР, ПАССИВНЫЙ ДОХОД, ПРОМОКОДЫ И REJEWPAY -->
    <script>
        // --- ИГРА 4: АПГРЕЙДЕР ---
        function updateUpgraderUI() {
            const input = document.getElementById('upgrader-target-input');
            let target = parseFloat(input.value);
            if (isNaN(target)) target = 1.1;
            if (target < 1.1) target = 1.1;
            if (target > 100) target = 100;

            const chance = Math.max(0.95, Math.min(90, (95 / target))).toFixed(1);
            
            document.getElementById('upgrader-target-mult').innerText = `x${target.toFixed(2)}`;
            document.getElementById('upgrader-chance-lbl').innerText = `${chance}% Шанс`;

            // Обновляем conic-gradient на круге
            const degrees = (chance / 100) * 360;
            const ring = document.getElementById('upgrader-ring');
            if (ring) {
                ring.style.background = `conic-gradient(var(--purple) 0deg ${degrees}deg, #1f1f24 ${degrees}deg 360deg)`;
            }
        }

        let isUpgrading = false;
        function triggerUpgrader() {
            if (isUpgrading) return;
            if (state.maintenance && state.user.role !== 'admin') {
                showToast('Казино на техобслуживании!', 'error');
                return;
            }
            if (!state.user.inventory.permits.includes('p_upgrader')) {
                showToast('Нужен Сертификат Апгрейдера из Маркета!', 'error');
                return;
            }

            const betInput = document.getElementById('upgrader-bet');
            const targetInput = document.getElementById('upgrader-target-input');
            const bet = parseFloat(betInput.value);
            const target = parseFloat(targetInput.value);

            if (isNaN(bet) || bet < 10) {
                showToast('Мин. ставка: 10 $RJC', 'error');
                return;
            }
            if (state.user.balance < bet) {
                showToast('Недостаточно баланса!', 'error');
                return;
            }
            if (isNaN(target) || target < 1.1 || target > 100) {
                showToast('Некорректный множитель!', 'error');
                return;
            }

            state.user.balance -= bet;
            state.user.totalGames++;
            state.stats.totalTurnover += bet;
            isUpgrading = true;
            updateUI();

            const chance = (95 / target); // базовый шанс в %
            const needle = document.getElementById('upgrader-needle');
            
            // Расчет победы
            let isWin = checkRigResult();
            
            // Финальный угол стрелки (в градусах)
            const winMaxDeg = (chance / 100) * 360;
            let finalDeg = 0;

            if (isWin) {
                finalDeg = Math.random() * (winMaxDeg - 5) + 2;
            } else {
                finalDeg = winMaxDeg + 5 + Math.random() * (355 - winMaxDeg);
            }

            const totalRotations = 360 * 4 + finalDeg;
            needle.style.transition = 'transform 2.5s cubic-bezier(0.15, 0.9, 0.2, 1)';
            needle.style.transform = `rotate(${totalRotations}deg)`;

            setTimeout(() => {
                if (isWin) {
                    const winAmt = Math.floor(bet * target);
                    state.user.balance += winAmt;
                    state.user.wins++;
                    showToast(`АПГРЕЙД УСПЕШЕН! +${winAmt.toLocaleString()} $RJC (x${target})`, 'purple');
                } else {
                    state.user.losses++;
                    showToast(`Апгрейд сорвался! -${bet} $RJC`, 'error');
                }

                needle.style.transition = 'none';
                needle.style.transform = `rotate(${finalDeg % 360}deg)`;
                isUpgrading = false;
                saveState();
                updateUI();
            }, 2600);
        }

        // --- ИГРА 5: КЛИКЕР И ПАССИВНЫЙ ДОХОД ---
        function executeCoinClick() {
            if (state.maintenance && state.user.role !== 'admin') {
                showToast('Казино на техобслуживании!', 'error');
                return;
            }
            const earned = state.user.clickBoost;
            state.user.balance += earned;
            saveState();
            updateUI();
        }

        function startPassiveIncomeTimer() {
            setInterval(() => {
                let passiveIncome = 0;
                if (state.user.inventory.houses) {
                    state.user.inventory.houses.forEach(hId => {
                        const house = HOUSES_DATA.find(h => h.id === hId);
                        if (house) passiveIncome += house.income;
                    });
                }

                if (passiveIncome > 0) {
                    const incomePerSec = passiveIncome / 60;
                    state.user.balance += incomePerSec;
                    updateUI();
                }
            }, 1000);
        }

        // --- СИСТЕМА ПРОМОКОДОВ ---
        function activatePromo() {
            const input = document.getElementById('user-promo-input');
            const code = input.value.trim().toUpperCase();

            if (!code) {
                showToast('Введите промокод!', 'error');
                return;
            }

            const promo = state.promocodes[code];
            if (!promo) {
                showToast('Промокод не существует!', 'error');
                return;
            }

            if (promo.usedBy && promo.usedBy.includes(state.user.id)) {
                showToast('Вы уже активировали этот промокод!', 'error');
                return;
            }

            if (promo.uses >= promo.limit) {
                showToast('Активации промокода закончились!', 'error');
                return;
            }

            promo.uses++;
            if (!promo.usedBy) promo.usedBy = [];
            promo.usedBy.push(state.user.id);

            state.user.balance += promo.reward;
            showToast(`Промокод применен! +${promo.reward.toLocaleString()} $RJC`, 'success');
            
            input.value = '';
            saveState();
            updateUI();
        }

        function adminCreatePromo() {
            if (state.user.role !== 'admin') return;

            const name = document.getElementById('promo-name').value.trim().toUpperCase();
            const limit = parseInt(document.getElementById('promo-limit').value);
            const reward = parseFloat(document.getElementById('promo-reward').value);

            if (!name || isNaN(limit) || isNaN(reward) || limit <= 0 || reward <= 0) {
                showToast('Заполните все поля промокода корректно!', 'error');
                return;
            }

            state.promocodes[name] = {
                limit: limit,
                uses: 0,
                reward: reward,
                usedBy: []
            };

            showToast(`Промокод ${name} успешно создан!`, 'gold');
            document.getElementById('promo-name').value = '';
            document.getElementById('promo-limit').value = '';
            document.getElementById('promo-reward').value = '';
            saveState();
        }

        // --- ПЕРЕВОДЫ REJEWPAY ---
        function processTransfer() {
            const targetUsername = document.getElementById('transfer-target').value.trim().replace('@', '');
            const comment = document.getElementById('transfer-comment').value.trim();
            const amount = parseFloat(document.getElementById('transfer-amount').value);

            if (!targetUsername) {
                showToast('Укажите юзернейм получателя!', 'error');
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showToast('Укажите корректную сумму!', 'error');
                return;
            }
            if (state.user.balance < amount) {
                showToast('Недостаточно средств на балансе!', 'error');
                return;
            }
            if (targetUsername.toLowerCase() === state.user.username.toLowerCase()) {
                showToast('Нельзя переводить самому себе!', 'error');
                return;
            }

            state.user.balance -= amount;
            
            // Логируем транзакцию
            const tx = {
                id: Math.random().toString(36).substr(2, 9),
                from: state.user.username,
                to: targetUsername,
                amount: amount,
                comment: comment || 'Перевод средств',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            state.transactions.unshift(tx);
            if (state.transactions.length > 20) state.transactions.pop();

            showToast(`Успешно переведено ${amount.toLocaleString()} $RJC юзеру @${targetUsername}`, 'success');
            
            document.getElementById('transfer-target').value = '';
            document.getElementById('transfer-comment').value = '';
            document.getElementById('transfer-amount').value = '';

            saveState();
            updateUI();
        }

        function renderTransactions() {
            const container = document.getElementById('transactions-list');
            if (!container) return;

            if (state.transactions.length === 0) {
                container.innerHTML = `<div style="color:var(--text-secondary); font-size:0.8rem; text-align:center; padding:10px;">История пуста</div>`;
                return;
            }

            container.innerHTML = '';
            state.transactions.forEach(tx => {
                const el = document.createElement('div');
                el.className = 'msg-box';
                el.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span style="font-weight:700; color:var(--gold);">@${tx.from} ➔ @${tx.to}</span>
                        <span style="font-size:0.7rem; color:var(--text-secondary);">${tx.time}</span>
                    </div>
                    <div style="font-size:0.9rem; font-weight:800; color:var(--green); margin-bottom:2px;">-${tx.amount.toLocaleString()} $RJC</div>
                    <div style="font-size:0.75rem; color:#a1a1aa;">💬 ${tx.comment}</div>
                `;
                container.appendChild(el);
            });
        }
    <!-- БЛОК 5: АДМИН-ПАНЕЛЬ, ЧЕКЕР И ЗАКРЫВАЮЩИЕ ТЕГИ -->
    <script>
        // --- АДМИН ПАНЕЛЬ И УПРАВЛЕНИЕ ---

        function adminCheckUser() {
            if (state.user.role !== 'admin' && state.user.role !== 'moderator') return;

            const input = document.getElementById('admin-search-input').value.trim().replace('@', '');
            const resBox = document.getElementById('admin-user-result');

            if (!input) {
                showToast('Введите ID или Username пользователя!', 'error');
                return;
            }

            // Ищем пользователя в локальном реестре
            let found = null;
            if (state.otherUsers[input]) {
                found = state.otherUsers[input];
            } else {
                found = Object.values(state.otherUsers).find(u => u.username.toLowerCase() === input.toLowerCase());
            }

            if (!found) {
                resBox.style.display = 'block';
                resBox.innerHTML = `<div style="color:var(--red); font-size:0.85rem;">Пользователь "${input}" не найден в базе!</div>`;
                return;
            }

            resBox.style.display = 'block';
            resBox.innerHTML = `
                <div style="font-weight:700; color:var(--gold); margin-bottom:6px;">Инфо о юзере: @${found.username} (${found.id})</div>
                <div style="font-size:0.8rem; color:var(--text-secondary); line-height:1.5;">
                    • Имя: ${found.nickname}<br>
                    • Роль: <b>${found.role}</b><br>
                    • Баланс: <b>${Math.floor(found.balance).toLocaleString()} $RJC</b><br>
                    • Всего игр: ${found.totalGames} (Побед: ${found.wins} / Поражений: ${found.losses})
                </div>
            `;
        }

        function adminModifyBalance() {
            if (state.user.role !== 'admin') {
                showToast('Недостаточно прав! Только для Admin.', 'error');
                return;
            }

            const input = document.getElementById('admin-search-input').value.trim().replace('@', '');
            const amount = parseFloat(document.getElementById('admin-bal-amount').value);

            if (!input || isNaN(amount)) {
                showToast('Укажите юзера и сумму!', 'error');
                return;
            }

            let target = state.otherUsers[input] || Object.values(state.otherUsers).find(u => u.username.toLowerCase() === input.toLowerCase());

            if (!target) {
                showToast('Пользователь не найден!', 'error');
                return;
            }

            target.balance += amount;
            if (target.id === state.user.id) {
                state.user.balance = target.balance;
            }

            showToast(`Баланс @${target.username} изменен на ${amount > 0 ? '+' : ''}${amount} $RJC`, 'success');
            saveState();
            updateUI();
            adminCheckUser();
        }

        function adminSetRole(newRole) {
            if (state.user.role !== 'admin') {
                showToast('Недостаточно прав! Только для Admin.', 'error');
                return;
            }

            const input = document.getElementById('admin-search-input').value.trim().replace('@', '');
            if (!input) {
                showToast('Укажите ID или Username!', 'error');
                return;
            }

            let target = state.otherUsers[input] || Object.values(state.otherUsers).find(u => u.username.toLowerCase() === input.toLowerCase());

            if (!target) {
                showToast('Пользователь не найден!', 'error');
                return;
            }

            target.role = newRole;
            if (target.id === state.user.id) {
                state.user.role = newRole;
            }

            // Пересчитываем кол-во модеров
            const mods = Object.values(state.otherUsers).filter(u => u.role === 'moderator' || u.role === 'admin').length;
            state.stats.moderatorsCount = mods;

            showToast(`Роль @${target.username} изменена на ${newRole}!`, 'gold');
            saveState();
            updateUI();
            adminCheckUser();
        }

        function adminSetRig(mode) {
            if (state.user.role !== 'admin') {
                showToast('Подкрутка доступна только Администраторам!', 'error');
                return;
            }

            state.adminRig.mode = mode;
            let modeName = 'Обычный (Честный рандом)';
            if (mode === 'win_always') modeName = '100% Победа';
            if (mode === 'lose_always') modeName = '100% Проигрыш (Слив)';
            if (mode === 'boost_50') modeName = 'Повышенный шанс (75%)';

            showToast(`Режим подкрутки: ${modeName}`, 'purple');
            saveState();
        }

        function adminToggleMaintenance() {
            if (state.user.role !== 'admin') {
                showToast('Только для Главного Админа!', 'error');
                return;
            }

            state.maintenance = !state.maintenance;
            showToast(`Техработы: ${state.maintenance ? 'ВКЛЮЧЕНЫ 🔴' : 'ВЫКЛЮЧЕНЫ 🟢'}`, state.maintenance ? 'error' : 'success');
            saveState();
            updateUI();
        }

        function adminResetData() {
            if (state.user.role !== 'admin') return;
            if (confirm('Сбросить весь сохраненный прогресс локальной базы?')) {
                localStorage.removeItem('rejew_cas_state_v2');
                location.reload();
            }
        }
    </script>
</body>
</html>
